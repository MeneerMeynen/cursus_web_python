  <!-- blok-elementen: content-kleur DevTools -->
  <g stroke="#3F7A88" stroke-width="1.5" fill="#8CB6C0">
    <rect x="52" y="52"  width="416" height="52" rx="4"/>
    <rect x="52" y="112" width="416" height="52" rx="4"/>
    <rect x="52" y="172" width="416" height="52" rx="4"/>
    <rect x="52" y="232" width="416" height="52" rx="4"/>
  </g>

  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#1F2A44">
    <text x="66" y="83">h1</text>
    <text x="66" y="143">p</text>
    <text x="66" y="203">div</text>
    <text x="66" y="263">p</text>
  </g>

  <g font-size="14" fill="#1F2A44">
    <text x="110" y="143">tekst tekst</text>
    <text x="254" y="143">tekst tekst</text>
